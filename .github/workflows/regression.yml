name: Regression suite

# GitHub-hosted Linux runners cover the portable application, site, browser,
# and dependency checks. The macOS lane stays deliberately small because its
# minutes cost roughly 10x Linux minutes; it proves only the native Rust code
# that cannot be represented by a Linux build.
#
# Signing and notarization remain local release responsibilities. No CI runner
# receives signing or notary credentials.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and production builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun ci
      - name: Install Breve's frozen production graph
        run: bun install --production --frozen-lockfile
        working-directory: breve-runtime/defaults
      - run: bun run check
      - run: bun run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - run: bun ci
        working-directory: site
      - run: bun run build
        working-directory: site

  e2e:
    name: Browser E2E (Playwright)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun ci
      - run: bun run check:e2e-types
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  dependency-audit:
    name: Dependency vulnerability audit (advisory)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun ci
      # Current transitive advisories are tracked in
      # docs/development/security.md. Keep both scans visible but advisory
      # until the dependency trees can be clean without unsafe upgrades.
      - name: bun audit (JS/TS)
        continue-on-error: true
        run: bun audit
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: cargo audit (Rust)
        continue-on-error: true
        working-directory: src-tauri
        # Linux-only GTK3 in Tauri 2.11; the shipped macOS graph does not
        # include glib. Tracked with its dependency path in security.md.
        run: cargo audit --ignore RUSTSEC-2024-0429

  rust-macos:
    name: Rust (clippy + tests)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Rustup discovers rust-toolchain.toml from the checkout and installs its
      # exact channel, profile, and components before the cache or Cargo runs.
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.8.2
        with:
          workspaces: src-tauri -> target
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
