name: Regression suite

# GitHub-hosted Linux runners cover the portable application, site, browser,
# and dependency checks. The macOS lane stays deliberately small because its
# minutes cost roughly 10x Linux minutes; it proves only the native Rust code
# that cannot be represented by a Linux build.
#
# Signing and notarization remain local release responsibilities. No CI runner
# receives signing or notary credentials.

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A website- or docs-only change skips the app lanes (scripts/ci-scope.ts).
  # A skipped job passes a required check, so the gated lanes run unless this
  # job explicitly answered "false" — a failed scope runs everything.
  changes:
    name: Change scope
    runs-on: ubuntu-24.04
    outputs:
      app: ${{ steps.scope.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '0000000000000000000000000000000000000000' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bun scripts/ci-scope.ts "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  repository-secrets:
    name: Repository secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install checksum-pinned Gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --show-error --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check --strict
          mkdir gitleaks-bin
          tar -xzf gitleaks.tar.gz -C gitleaks-bin gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Scan proposed commits with redacted diagnostics
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '0000000000000000000000000000000000000000' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/scan-changed-secrets.sh "$BASE_SHA" "$HEAD_SHA"

  quality:
    name: Quality and production builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun ci
      - name: Install Breve's frozen production graph
        run: bun install --production --frozen-lockfile
        working-directory: breve-runtime/defaults
      - run: bun run check
      - run: bun run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - run: bun ci
        working-directory: site
      - name: Check dependency convergence across every lockfile
        run: bun run deps dedupe-check
      - name: Check reviewed production-license metadata
        run: bun run deps licenses-check
      - name: Capture production dependency licenses
        run: bun run --silent deps licenses > dependency-licenses.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-licenses
          path: dependency-licenses.json
          retention-days: 30
      - run: bun run check
        working-directory: site
      - run: bun run build
        working-directory: site
      - run: bun run build
        working-directory: site
        env:
          SITE_MODE: coming-soon

  e2e:
    name: Browser E2E (Playwright)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun ci
      - run: bun run check:e2e-types
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - name: Rotli Web E2E (web bundle under /app/)
        run: bun run test:e2e:web
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  dependency-audit:
    name: Dependency vulnerability audit (advisory)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun ci
      # Current transitive advisories are tracked in
      # docs/development/security.md. The repository-owned workflow audits the
      # app, site, and independently installed Breve lockfiles. Keep both
      # language scans visible but advisory until the dependency trees can be
      # clean without unsafe upgrades.
      - name: bun audit (all JS/TS lockfiles)
        continue-on-error: true
        run: bun run deps audit
      - name: Cache cargo-audit
        id: cargo-audit-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-0.22.2-${{ runner.os }}
      - name: Install cargo-audit
        if: steps.cargo-audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: cargo audit (Rust)
        continue-on-error: true
        working-directory: src-tauri
        # Linux-only GTK3 in Tauri 2.11; the shipped macOS graph does not
        # include glib. Tracked with its dependency path in security.md.
        run: cargo audit --ignore RUSTSEC-2024-0429

  rust-linux-check:
    # The crate carries 20 `cfg(not(target_os = "macos"))` blocks that no lane
    # compiled (audit 2026-09-03). A type-check on Linux keeps them honest
    # without paying macOS minutes; tests still run on macOS where the native
    # tool paths exist.
    name: Rust (Linux cargo check)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tauri's Linux build inputs
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.8.2
        with:
          workspaces: src-tauri -> target
      - run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

  rust-macos:
    name: Rust (clippy + tests)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Rustup discovers rust-toolchain.toml from the checkout and installs its
      # exact channel, profile, and components before the cache or Cargo runs.
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.8.2
        with:
          workspaces: src-tauri -> target
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
