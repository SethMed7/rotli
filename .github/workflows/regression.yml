name: Regression suite

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-contracts:
    name: Types, lint, and architecture contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - run: bun run lint

  design-system:
    name: Themes and design system
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - run: bun run check:hex
      - run: bun run check:design-system
      - run: bun test src/state/theme.test.ts src/brand/brevePdfThemes.test.ts src/brand/univerTheme.test.ts

  e2e:
    name: Browser E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - run: bun run check:e2e-types
      - run: npx playwright install --with-deps chromium
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  dependency-audit:
    name: Dependency vulnerability audit (advisory)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # rustsec/audit-check publishes its report as a check run. The workflow's
      # top-level read-only token caused the action itself to fail after a valid
      # scan with "Resource not accessible by integration".
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      # NON-BLOCKING: the current advisories are all transitive-only and tracked
      # with dependency paths in docs/development/security.md
      # under "reported, not fixed". This lane surfaces NEW advisories in the PR
      # log without failing the merge on upstream churn we don't control. Promote
      # to blocking once the tree is clean.
      - name: bun audit (JS/TS)
        continue-on-error: true
        run: bun audit
      # rustsec/audit-check installs and runs cargo-audit inside the runner — no
      # local cargo-audit install needed by any contributor. Advisory for now
      # (same rationale); flip `ignore`/failure policy when the Rust tree is clean.
      - name: cargo audit (Rust)
        continue-on-error: true
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
          # Linux-only GTK3 in Tauri 2.11; the shipped macOS graph does not
          # include glib. Tracked with its dependency path in security.md.
          ignore: RUSTSEC-2024-0429

  full-regression:
    name: App, Breve, Rust, and production build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: bun install --frozen-lockfile
      - run: bun run test:regression
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: bun run build
        env:
          # Vite's large Univer/Excalidraw graph exceeds Node's ~2 GB default
          # heap on hosted macOS runners while rendering chunks.
          NODE_OPTIONS: --max-old-space-size=4096
