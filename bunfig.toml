# Bun test runner config. The preload installs minimal browser globals before
# any test module loads (see test-setup.ts), so frontend modules that read
# `window`/`document` at import time pick their non-Tauri (in-memory) branch.
[test]
preload = ["./test-setup.ts"]

[install]
# Hold new direct and transitive resolutions for three days so a compromised
# release has time to be discovered. Frozen lockfile installs are unchanged.
minimumReleaseAge = 259200
