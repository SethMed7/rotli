# Bun test runner config. The preload installs minimal browser globals before
# any test module loads (see test-setup.ts), so frontend modules that read
# `window`/`document` at import time pick their non-Tauri (in-memory) branch.
[test]
preload = ["./test-setup.ts"]

[install]
# A plain `bun install` is deterministic too. An older Bun that cannot read
# lockfile v2 must fail without replacing the reviewed graph.
frozenLockfile = true
# Hold new direct and transitive resolutions for three days so a compromised
# release has time to be discovered. Frozen lockfile installs are unchanged.
minimumReleaseAge = 259200
# Repository dependencies must install deterministically without executing
# package lifecycle hooks. Keep each graph isolated without Bun's shared global
# store so type and peer resolution remain local to this checkout.
ignoreScripts = true
linker = "isolated"
globalStore = false
