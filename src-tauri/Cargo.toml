[package]
name = "rotli"
version = "1.0.0"
description = "rotli — warm, local-first, hotkey-driven notes for the Mac menu bar"
authors = ["Rotli contributors"]
edition = "2021"
# Two binaries live here: the Tauri app (`src/main.rs`) and `rotli-helper`
# (`src/bin/rotli_helper.rs`), the standalone loopback bridge Rotli Web pairs
# with. The file is snake_case because `check:structure` holds that law for
# `src-tauri/src`; the explicit target keeps the user-facing command hyphenated.
default-run = "rotli"

[[bin]]
name = "rotli-helper"
path = "src/bin/rotli_helper.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rotli_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: groundwork for the transparent always-on-top capture card (1c).
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api", "protocol-asset", "unstable"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-deep-link = "2"                                     # rotli:// links (CLI/MCP → the app)
tauri-plugin-dialog = "2"                                        # native folder picker (move the corpus)
percent-encoding = "2"                                           # deep-link id encoding (already transitive)
tauri-plugin-updater = "2"                                       # in-app updates (signed feed → download + relaunch)
ureq = { version = "2", features = ["json"] }                   # Chat front: POST the on-device model from Rust (the webview CSP blocks localhost)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"                                                     # secret-pattern detection (the `secure` flag)
base64 = "0.22"                                                 # surfaced binary files → base64 for the in-app viewer (xlsx, …)
pdf-extract = "0.12"                                            # offline embedded-text extraction for PDF → editable DOCX copies
# Phase 2 — the corpus (plain .md files become real)
notify = "8"                                                     # fs watcher (external edits → UI refresh)
ulid = "1"                                                       # note identity (time-sortable, matches the TS ulid)
time = { version = "0.3", features = ["formatting", "parsing"] } # frontmatter created/updated (RFC 3339)
sha2 = "0.10"                                                    # Welcome re-seed: recognize shipped lesson bodies (already transitive)
tempfile = "3"                                                   # atomic writes: tmp in the same dir + rename
trash = "5"                                                     # delete = OS trash, never a hard rm
uuid = { version = "1", features = ["v4"] }                     # mx_<uuid> ids for a rotli-initiated memex
# Full-text search index (adapter: src/search_index.rs). DERIVED + gitignored +
# rebuildable — never a database (the .md files stay durable truth). Large dep;
# binary-size impact measured in the PR. NOT on check:structure's denied-DB list.
tantivy = "0.26.1"
tauri-plugin-clipboard-manager = "2"

# macOS-only crates: the Keychain and the AppKit bindings behind the runtime
# Dock/app icon swap (Settings → Appearance → App icon).
# rotli-helper refuses to reuse a pairing-token file owned by another account;
# getuid is the one thing std has no portable reader for. Already in the tree
# transitively — this only names the edge.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# Keychain-backed user secrets — never argv/ps/config. keychain.rs carries the
# not(macos) stub, so the crate itself must not be asked for on Linux/Windows.
security-framework = "3"
objc2 = "0.6"
# NSFilePromiseReceiver + NSBitmapImageRep serve the screenshot-thumbnail drop
# (native_drag_promise.rs): the macOS ⌘⇧4/⌘⇧5 preview hands a FILE PROMISE and
# raw image bytes, never a path, so the promise reader block (block2) and the
# TIFF→PNG re-encode are what turn that drag into a file Rotli can import.
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSBitmapImageRep", "NSFilePromiseReceiver", "NSImage", "NSImageRep", "NSPasteboard", "NSPasteboardItem", "NSResponder", "block2"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSDictionary", "NSError", "NSOperation", "NSString", "NSURL"] }
block2 = "0.6"                                                   # the promised-file reader block (already transitive; named here because we write one)

# Size diet (2026-07-31): the release binary embeds the whole frontend dist, and
# without a profile the code portion shipped 16 codegen units, no LTO, and 51k
# symbols (4.8 MB __LINKEDIT). panic = "abort" is deliberately ABSENT:
# document_conversion.rs relies on catch_unwind to turn pdf-extract panics on
# malformed PDFs into a user-facing error instead of a process abort.
# `tauri dev` builds this profile. Unoptimized, the corpus walk over a real
# vault is ~16x slower than release (4.6s vs 0.28s for `notes list` on a
# 250-note memex, 2026-09-01), which made every structural refresh in the dev
# app read as "lag" that release users never see. opt-level 1 keeps debug info
# and incremental builds while making the dev app representative.
# CI runs clippy with -D warnings; without this table a local `cargo clippy`
# passed code CI rejects (audit 2026-09-03). Now the crate says so itself.
[lints.rust]
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }

[profile.dev]
opt-level = 1

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
