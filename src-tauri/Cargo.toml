[package]
name = "rotli"
version = "0.83.0"
description = "rotli — warm, local-first, hotkey-driven notes for the Mac menu bar"
authors = ["Rotli contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rotli_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: groundwork for the transparent always-on-top capture card (1c).
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api", "protocol-asset", "unstable"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-deep-link = "2"                                     # rotli:// links (CLI/MCP → the app)
tauri-plugin-dialog = "2"                                        # native folder picker (move the corpus)
percent-encoding = "2"                                           # deep-link id encoding (already transitive)
tauri-plugin-updater = "2"                                       # in-app updates (signed feed → download + relaunch)
ureq = { version = "2", features = ["json"] }                   # Chat front: POST the on-device model from Rust (the webview CSP blocks localhost)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"                                                     # secret-pattern detection (the `secure` flag)
base64 = "0.22"                                                 # surfaced binary files → base64 for the in-app viewer (xlsx, …)
pdf-extract = "0.12"                                            # offline embedded-text extraction for PDF → editable DOCX copies
# Phase 2 — the corpus (plain .md files become real)
notify = "8"                                                     # fs watcher (external edits → UI refresh)
ulid = "1"                                                       # note identity (time-sortable, matches the TS ulid)
time = { version = "0.3", features = ["formatting", "parsing"] } # frontmatter created/updated (RFC 3339)
tempfile = "3"                                                   # atomic writes: tmp in the same dir + rename
trash = "5"                                                     # delete = OS trash, never a hard rm
uuid = { version = "1", features = ["v4"] }                     # mx_<uuid> ids for a rotli-initiated memex
security-framework = "3"                                        # Keychain-backed secrets (Gemini API key) — never argv/ps/config
# Full-text search index (adapter: src/search_index.rs). DERIVED + gitignored +
# rebuildable — never a database (the .md files stay durable truth). Large dep;
# binary-size impact measured in the PR. NOT on check:structure's denied-DB list.
tantivy = "0.26.1"

# macOS-only: swap the Dock/app icon at runtime (Settings → Appearance → App icon)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSError", "NSString", "NSURL"] }

# Size diet (2026-07-31): the release binary embeds the whole frontend dist, and
# without a profile the code portion shipped 16 codegen units, no LTO, and 51k
# symbols (4.8 MB __LINKEDIT). panic = "abort" is deliberately ABSENT:
# document_conversion.rs relies on catch_unwind to turn pdf-extract panics on
# malformed PDFs into a user-facing error instead of a process abort.
[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
