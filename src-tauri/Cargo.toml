[package]
name = "rotli"
version = "0.26.0"
description = "rotli — warm, local-first, hotkey-driven notes for the Mac menu bar"
authors = ["Seth Medina"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rotli_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: groundwork for the transparent always-on-top capture card (1c).
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api", "protocol-asset"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"                                        # native folder picker (move the corpus)
tauri-plugin-updater = "2"                                       # in-app updates (signed feed → download + relaunch)
tauri-plugin-process = "2"                                       # relaunch() after an update installs
ureq = { version = "2", features = ["json"] }                   # Chat front: POST the on-device model from Rust (the webview CSP blocks localhost)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"                                                     # secret-pattern detection (the `secure` flag)
base64 = "0.22"                                                 # surfaced binary files → base64 for the in-app viewer (xlsx, …)
# Phase 2 — the corpus (plain .md files become real)
notify = "8"                                                     # fs watcher (external edits → UI refresh)
ulid = "1"                                                       # note identity (time-sortable, matches the TS ulid)
time = { version = "0.3", features = ["formatting", "parsing"] } # frontmatter created/updated (RFC 3339)
tempfile = "3"                                                   # atomic writes: tmp in the same dir + rename
trash = "5"                                                     # delete = OS trash, never a hard rm
uuid = { version = "1", features = ["v4"] }                     # mx_<uuid> ids for a rotli-initiated memex
security-framework = "3"                                        # Keychain-backed secrets (Gemini API key) — never argv/ps/config

# macOS-only: swap the Dock/app icon at runtime (Settings → Appearance → App icon)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }
