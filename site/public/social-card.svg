<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Rotli — room to think, files you keep</title>
  <desc id="description">A deep ocean product card showing Rotli as a local-first workspace built around one folder.</desc>
  <rect width="1200" height="630" fill="#0e171d"/>
  <rect x="42" y="42" width="1116" height="546" rx="22" fill="#152229" stroke="#41606e" stroke-width="2"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="94" y="112" fill="#9acde7" font-size="22" font-weight="700" letter-spacing="2">ROTLI / LOCAL-FIRST WORKSPACE</text>
    <text x="92" y="224" fill="#eff7fa" font-size="72" font-weight="700" letter-spacing="-3">Room to think.</text>
    <text x="92" y="306" fill="#eff7fa" font-size="72" font-weight="700" letter-spacing="-3">Files you keep.</text>
    <text x="96" y="376" fill="#adc0c9" font-size="25">One folder on your Mac. Notes, editable files,</text>
    <text x="96" y="414" fill="#adc0c9" font-size="25">boards, and AI conversations.</text>
    <text x="96" y="510" fill="#eff7fa" font-size="24" font-weight="700">rotli</text>
    <text x="96" y="543" fill="#adc0c9" font-size="18">No account · useful offline · free and open source</text>
  </g>

  <g transform="translate(748 104)">
    <rect width="344" height="390" rx="16" fill="#101b20" stroke="#41606e" stroke-width="2"/>
    <rect width="344" height="54" rx="16" fill="#1c2d35"/>
    <path d="M0 54H344" stroke="#2a404a" stroke-width="2"/>
    <circle cx="24" cy="27" r="6" fill="#70b2d7"/>
    <circle cx="44" cy="27" r="6" fill="#8cc4a5"/>
    <circle cx="64" cy="27" r="6" fill="#a1b6c0"/>
    <rect x="92" y="15" width="196" height="24" rx="12" fill="#213843" stroke="#2a404a"/>

    <g font-family="Arial, Helvetica, sans-serif">
      <text x="24" y="92" fill="#9acde7" font-size="13" font-weight="700" letter-spacing="1">ONE FOLDER</text>
      <text x="24" y="128" fill="#eff7fa" font-size="25" font-weight="700">Field Notes</text>
      <text x="24" y="164" fill="#adc0c9" font-size="15">⌄  wiki/</text>
      <text x="46" y="194" fill="#eff7fa" font-size="15">◇  launch-notes.md</text>
      <text x="46" y="224" fill="#eff7fa" font-size="15">◇  reading-list.md</text>
      <text x="24" y="264" fill="#adc0c9" font-size="15">⌄  storage/</text>
      <text x="46" y="294" fill="#eff7fa" font-size="15">□  project-brief.docx</text>
      <text x="46" y="324" fill="#eff7fa" font-size="15">▦  forecast.xlsx</text>
      <text x="24" y="364" fill="#adc0c9" font-size="15">·  .rotli/  rebuildable metadata</text>
    </g>
  </g>
</svg>
