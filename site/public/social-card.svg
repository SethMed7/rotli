<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Rotli — room to think, files you keep</title>
  <desc id="description">The rotli wordmark and "Room to think. Files you keep." over a faint pattern of file icons, the app tilted in from the right, and the line-art quokka waving up from the bottom edge.</desc>
  <!-- Rendered by scripts/build-social-card.mjs: fonts/ and asset: references are inlined, the network is off. -->
  <style>@font-face { font-family: "General Sans"; src: url("fonts/GeneralSans-Semibold.woff2"); font-weight: 700; } @font-face { font-family: "Baloo 2"; src: url("fonts/Baloo2-600.ttf"); font-weight: 600; }</style>
  <defs>
    <!-- The background: a faint tile of notes, a folder, and a checklist. -->
    <pattern id="files" width="160" height="160" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#3a3028" stroke-opacity="0.09" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><g transform="translate(18 22) rotate(-8)"><path d="M0 0h20l8 8v28H0z M20 0v8h8"/><path d="M5 15h16M5 21h16M5 27h10"/></g><g transform="translate(96 30) rotate(6)"><path d="M0 4h11l4 4h19v22H0z"/></g><g transform="translate(40 100) rotate(5)"><path d="M0 0h26v34H0z"/><path d="M5 9h5v5H5zM14 11h8M5 20h5v5H5zM14 22h8"/></g><g transform="translate(112 104) rotate(-4)"><path d="M0 0h18l7 7v25H0z M18 0v7h7"/><path d="M5 14h14M5 20h9"/></g></g>
    </pattern>
    <!-- The pattern fades out behind the headline. -->
    <radialGradient id="files-fade" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(336 239) scale(720 441)">
      <stop offset="0.3" stop-color="#000"/>
      <stop offset="0.8" stop-color="#fff"/>
    </radialGradient>
    <mask id="files-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="630">
      <rect width="1200" height="630" fill="url(#files-fade)"/>
    </mask>
    <filter id="window-shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="30" stdDeviation="26" flood-color="#3a3028" flood-opacity="0.3"/>
    </filter>
    <clipPath id="window-clip"><rect x="700" y="120" width="860" height="537.5" rx="18"/></clipPath>
    <!-- The quokka's silhouette, so the pattern never shows inside it. -->
    <mask id="quokka-mask" maskUnits="userSpaceOnUse" x="150" y="432" width="330" height="330">
      <image href="asset:src/assets/characters/masks/waving.webp" x="150" y="432" width="330" height="330"/>
    </mask>
  </defs>

  <rect width="1200" height="630" fill="#f8f2e9"/>
  <rect width="1200" height="630" fill="url(#files)" mask="url(#files-mask)"/>

  <text x="72" y="100" fill="#3a3028" font-family="'Baloo 2', sans-serif" font-size="40" font-weight="600" letter-spacing="-0.5">rotli</text>
  <g font-family="'General Sans', Arial, sans-serif" font-size="78" font-weight="700" letter-spacing="-3.5" fill="#3a3028">
    <text x="68" y="219">Room to think.</text>
    <text x="68" y="295">Files you keep.</text>
  </g>

  <!-- The app, tilted in from the right. -->
  <g transform="rotate(-7 1130 388.75)">
    <rect x="700" y="120" width="860" height="537.5" rx="18" fill="#fbf6ee" filter="url(#window-shadow)"/>
