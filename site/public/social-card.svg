<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Rotli — room to think, files you keep</title>
  <desc id="description">A Rotli Light product card showing notes and chat in one folder you own.</desc>
  <style>@font-face { font-family: "General Sans"; src: url("fonts/GeneralSans-Regular.woff2"); font-weight: 400; } @font-face { font-family: "General Sans"; src: url("fonts/GeneralSans-Semibold.woff2"); font-weight: 700; }</style>
  <rect width="1200" height="630" fill="#f8f2e9"/>
  <rect x="42" y="42" width="1116" height="546" rx="22" fill="#f8f2e9" stroke="#e2d3c1" stroke-width="2"/>

  <g font-family="General Sans, Arial, sans-serif">
    <text x="94" y="112" fill="#8f4e37" font-size="22" font-weight="700" letter-spacing="2">ROTLI / LOCAL-FIRST WORKSPACE</text>
    <text x="92" y="224" fill="#3a3028" font-size="72" font-weight="700" letter-spacing="-3">Room to think.</text>
    <text x="92" y="306" fill="#3a3028" font-size="72" font-weight="700" letter-spacing="-3">Files you keep.</text>
    <text x="96" y="376" fill="#6e6155" font-size="25">One folder on your Mac. Notes, tasks, links,</text>
    <text x="96" y="414" fill="#6e6155" font-size="25">and optional AI conversations.</text>
    <text x="96" y="510" fill="#3a3028" font-size="24" font-weight="700">rotli</text>
    <text x="96" y="543" fill="#6e6155" font-size="18">No account required · notes work offline</text>
  </g>

  <g transform="translate(748 104)">
    <rect width="344" height="390" rx="16" fill="#ffffff" stroke="#e2d3c1" stroke-width="2"/>
    <rect width="344" height="54" rx="16" fill="#f1e7d8"/>
    <path d="M0 54H344" stroke="#e2d3c1" stroke-width="2"/>
    <circle cx="24" cy="27" r="6" fill="#c97e62"/>
    <circle cx="44" cy="27" r="6" fill="#5f6b49"/>
    <circle cx="64" cy="27" r="6" fill="#cdb8a1"/>
    <rect x="92" y="15" width="196" height="24" rx="12" fill="#f8f2e9" stroke="#e2d3c1"/>

    <g font-family="General Sans, Arial, sans-serif">
      <text x="24" y="92" fill="#8f4e37" font-size="13" font-weight="700" letter-spacing="1">ONE FOLDER</text>
      <text x="24" y="128" fill="#3a3028" font-size="25" font-weight="700">Field Notes</text>
      <text x="24" y="164" fill="#6e6155" font-size="15">⌄  wiki/</text>
      <text x="46" y="194" fill="#3a3028" font-size="15">◇  launch-notes.md</text>
      <text x="46" y="224" fill="#3a3028" font-size="15">◇  reading-list.md</text>
      <text x="24" y="264" fill="#6e6155" font-size="15">⌄  chats/</text>
      <text x="46" y="294" fill="#3a3028" font-size="15">◇  a-fresh-perspective.md</text>
      <text x="46" y="324" fill="#3a3028" font-size="15">◇  next-steps.md</text>
      <text x="24" y="364" fill="#6e6155" font-size="15">·  .rotli/  rebuildable metadata</text>
    </g>
  </g>
</svg>
